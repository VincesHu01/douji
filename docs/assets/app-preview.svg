<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
  <title id="title">Douji search interface preview</title><desc id="desc">A dark macOS window showing synthetic local search results.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18181b"/><stop offset="1" stop-color="#27272a"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="24" flood-opacity=".32"/></filter></defs>
  <rect width="1120" height="680" rx="32" fill="#0f172a"/><rect x="45" y="42" width="1030" height="596" rx="22" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="76" cy="72" r="8" fill="#ff5f57"/><circle cx="102" cy="72" r="8" fill="#febc2e"/><circle cx="128" cy="72" r="8" fill="#28c840"/>
  <g font-family="-apple-system, BlinkMacSystemFont, sans-serif">
    <text x="78" y="130" fill="#fafafa" font-size="28" font-weight="700">豆迹 · Douji</text><text x="78" y="156" fill="#a1a1aa" font-size="15">Find a forgotten moment in your Doubao history</text>
    <rect x="78" y="185" width="744" height="48" rx="11" fill="#3f3f46" stroke="#3b82f6" stroke-width="2"/><text x="98" y="216" fill="#f4f4f5" font-size="17">local model context window</text>
    <rect x="840" y="185" width="112" height="48" rx="11" fill="#3b82f6"/><text x="871" y="216" fill="white" font-size="16" font-weight="600">Search</text><rect x="964" y="185" width="78" height="48" rx="11" fill="#3f3f46"/><text x="981" y="216" fill="#e4e4e7" font-size="15">Sync</text>
    <text x="78" y="272" fill="#a1a1aa" font-size="14">3 results · best turn per conversation · relevance first</text>
    <g transform="translate(78 296)"><rect width="964" height="128" rx="16" fill="#303036"/><text x="20" y="31" fill="#fafafa" font-size="18" font-weight="700">Understanding local model context</text><rect x="782" y="16" width="162" height="34" rx="9" fill="#2563eb"/><text x="804" y="39" fill="white" font-size="14" font-weight="600">Open and locate</text><text x="20" y="61" fill="#93c5fd" font-size="14">Question · fuzzy match · turn 4</text><text x="20" y="87" fill="#e4e4e7" font-size="15">You: How large is the context window when the model runs locally?</text><text x="20" y="111" fill="#a1a1aa" font-size="14">Answer: The practical limit depends on model size, memory, and KV cache…</text></g>
    <g transform="translate(78 440)"><rect width="964" height="128" rx="16" fill="#303036"/><text x="20" y="31" fill="#fafafa" font-size="18" font-weight="700">Private research assistant setup</text><rect x="782" y="16" width="162" height="34" rx="9" fill="#3f3f46"/><text x="804" y="39" fill="#e4e4e7" font-size="14" font-weight="600">Open and locate</text><text x="20" y="61" fill="#93c5fd" font-size="14">Answer · fuzzy match · turn 2</text><text x="20" y="87" fill="#e4e4e7" font-size="15">You: Can the whole retrieval flow stay on my Mac?</text><text x="20" y="111" fill="#a1a1aa" font-size="14">Answer: Yes. Keep the index and optional language model local…</text></g>
    <text x="78" y="608" fill="#71717a" font-size="13">Illustration uses synthetic sample data.</text>
  </g>
</svg>
