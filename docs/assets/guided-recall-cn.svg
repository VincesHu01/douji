<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720">
  <rect width="1120" height="720" fill="#f1f4f8"/><rect x="40" y="30" width="1040" height="660" rx="22" fill="#121317"/>
  <circle cx="68" cy="58" r="7" fill="#ff5f57"/><circle cx="91" cy="58" r="7" fill="#febc2e"/><circle cx="114" cy="58" r="7" fill="#28c840"/>
  <text x="62" y="110" fill="#f7f7f8" font-size="29" font-weight="700" font-family="PingFang SC, sans-serif">逐层梳理</text>
  <text x="62" y="138" fill="#9ca3af" font-size="15" font-family="PingFang SC, sans-serif">不用先想出准确关键词，像聊天一样逐步找回</text>
  <rect x="925" y="93" width="118" height="40" rx="10" fill="#292c32"/><text x="954" y="119" fill="#e5e7eb" font-size="14" font-family="PingFang SC, sans-serif">返回搜索</text>
  <rect x="62" y="158" width="981" height="42" rx="10" fill="#172c25" stroke="#265b46"/>
  <text x="82" y="184" fill="#86efac" font-size="13" font-family="PingFang SC, sans-serif">● 本机模型已连接：qwen3:8b　候选摘要仅发送到本机，不经过云端</text>
  <rect x="62" y="221" width="682" height="66" rx="16" fill="#25282e"/>
  <text x="82" y="247" fill="#f3f4f6" font-size="14" font-family="PingFang SC, sans-serif">先告诉我你大概记得什么。主题、用途、时间、问题语气都可以，</text>
  <text x="82" y="271" fill="#f3f4f6" font-size="14" font-family="PingFang SC, sans-serif">不需要是原话。</text>
  <rect x="330" y="305" width="713" height="54" rx="16" fill="#1d4f91"/>
  <text x="355" y="338" fill="white" font-size="15" font-family="PingFang SC, sans-serif">好像聊过论文创新，但记不清具体关键词，也可能和企业管理有关。</text>
  <rect x="62" y="378" width="786" height="79" rx="16" fill="#25282e"/>
  <text x="82" y="406" fill="#f3f4f6" font-size="14" font-family="PingFang SC, sans-serif">我找到几组可能方向。你更记得它是在讨论“研究方法”，还是在分析</text>
  <text x="82" y="431" fill="#f3f4f6" font-size="14" font-family="PingFang SC, sans-serif">“企业经营问题”？如果都不是，也可以直接描述你新想起的细节。</text>
  <rect x="62" y="474" width="226" height="38" rx="19" fill="#273a55" stroke="#41668f"/><text x="105" y="499" fill="#bfdbfe" font-size="14" font-family="PingFang SC, sans-serif">更像研究方法与论文</text>
  <rect x="301" y="474" width="226" height="38" rx="19" fill="#2b2e35"/><text x="341" y="499" fill="#d1d5db" font-size="14" font-family="PingFang SC, sans-serif">更像企业经营分析</text>
  <rect x="540" y="474" width="121" height="38" rx="19" fill="#2b2e35"/><text x="579" y="499" fill="#d1d5db" font-size="14" font-family="PingFang SC, sans-serif">都不是</text>
  <rect x="62" y="530" width="981" height="48" rx="12" fill="#1b1d22" stroke="#3b82f6"/>
  <text x="82" y="560" fill="#7f8793" font-size="14" font-family="PingFang SC, sans-serif">自由回答，例如：“更像第二个，但我记得是在问博士论文的创新点”</text>
  <rect x="952" y="537" width="78" height="34" rx="9" fill="#3b82f6"/><text x="979" y="559" fill="white" font-size="14" font-family="PingFang SC, sans-serif">发送</text>
  <text x="62" y="612" fill="#9ca3af" font-size="13" font-family="PingFang SC, sans-serif">当前候选 3 条 · 最可能命中</text>
  <rect x="62" y="625" width="981" height="43" rx="10" fill="#24262c"/>
  <text x="82" y="652" fill="#f3f4f6" font-size="14" font-weight="600" font-family="PingFang SC, sans-serif">论文创新点与研究设计</text>
  <text x="332" y="652" fill="#aeb4bf" font-size="13" font-family="PingFang SC, sans-serif">第 5 轮：数字化转型如何影响制造企业的供应链韧性？</text>
  <text x="941" y="652" fill="#60a5fa" font-size="13" font-family="PingFang SC, sans-serif">查看 →</text>
</svg>
