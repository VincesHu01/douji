<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#1c1c1e">
  <meta name="description" content="豆迹真实界面交互演示：浏览演示历史，体验轮次搜索、高级搜索、引导找回和精确定位。">
  <title>豆迹 · 真实界面演示</title>
  <link rel="icon" type="image/png" href="./assets/app-icon.png">
  <link rel="stylesheet" href="./demo.css?v=real-ui-3">
</head>
<body>
  <main class="app-window">
    <div class="titlebar">
      <div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div>
      <span>豆迹</span>
    </div>

    <section class="app-content">
      <header class="app-head">
        <div><h1>豆迹</h1><p>找回你和豆包聊过的内容</p></div>
        <div class="head-actions">
          <button id="guidedToggle" class="mac-button">✦　引导找回</button>
          <button id="syncButton" class="mac-button">↻　同步</button>
        </div>
      </header>

      <section id="searchView">
        <div class="search-row">
          <label class="sr-only" for="query">搜索对话</label>
          <input id="query" type="search" placeholder="描述你记得的问题或回答…" autocomplete="off">
          <button id="advancedToggle" class="mac-button">高级搜索</button>
        </div>

        <div class="scope-row">
          <strong>搜索范围</strong>
          <div class="segmented" role="group" aria-label="搜索范围">
            <button class="active" data-scope="all">全部</button>
            <button data-scope="question">我的问题</button>
            <button data-scope="answer">豆包回答</button>
            <button data-scope="title">对话标题</button>
          </div>
          <button class="favorite" aria-label="收藏结果">☆ <span>0</span></button>
        </div>

        <div class="filter-row">
          <select aria-label="结果粒度"><option>▣ 每个对话 1 条</option><option>全部匹配轮次</option></select>
          <select aria-label="结果排序"><option>⇅ 相关度优先</option><option>最近更新优先</option></select>
          <button id="historyToggle" class="history-button">▤ 演示历史　3</button>
        </div>

        <div class="demo-guide"><span>先浏览演示历史，再用记得的线索搜索。</span><button id="guidedExample">一键体验完整流程</button></div>

        <div id="advancedPanel" class="advanced-panel" hidden>
          <div class="advanced-title"><strong>高级搜索：组合多个记忆线索</strong><span>最多 6 条</span></div>
          <div id="rules"></div>
          <button id="addRule" class="text-button">＋ 添加条件</button>
        </div>

        <div id="results" class="result-area" aria-live="polite">
          <div class="empty-state">
            <div class="quote-icon">❞</div>
            <h2>可以开始搜索了</h2>
            <p>演示库包含 3 个对话、6 条消息。</p>
            <div><button id="historyEmpty" class="mac-button">浏览演示历史</button><button id="exampleButton" class="mac-button primary">试用示例搜索</button></div>
          </div>
        </div>
      </section>

      <section id="guidedView" hidden>
        <div class="guide-head"><button id="backButton" class="mac-button">‹ 返回搜索</button><strong>逐层梳理</strong></div>
        <div class="local-note">本演示使用合成候选，不连接模型，也不会上传内容。</div>
        <div id="chat" class="chat" aria-live="polite"></div>
        <form id="guideForm" class="composer">
          <label class="sr-only" for="guideInput">自由回答</label>
          <input id="guideInput" placeholder="说说你大概记得什么…" autocomplete="off">
          <button class="mac-button primary" type="submit">发送</button>
        </form>
        <div id="suggestions" class="suggestions"></div>
      </section>
    </section>

    <div id="historyModal" class="sheet-backdrop" hidden>
      <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
        <div class="sheet-head"><div><strong id="historyTitle">演示历史对话</strong><span>点击任意线索即可带入搜索</span></div><button class="close-sheet" data-close="historyModal" aria-label="关闭">×</button></div>
        <div id="historyList" class="history-list"></div>
      </section>
    </div>

    <div id="locateModal" class="sheet-backdrop" hidden>
      <section class="sheet locate-sheet" role="dialog" aria-modal="true" aria-labelledby="locateTitle">
        <div class="sheet-head"><div><strong id="locateTitle">已打开原对话并定位</strong><span>蓝色边框表示豆迹找到的目标轮次</span></div><button class="close-sheet" data-close="locateModal" aria-label="关闭">×</button></div>
        <div id="locatedConversation" class="located-conversation"></div>
      </section>
    </div>

    <footer>
      <div><b>演示库：3 个对话，6 条消息</b><span>公开知识片段与合成内容</span></div>
      <nav><button id="fullSync">完整同步</button><button>导入 JSON</button><a href="https://github.com/VincesHu01/douji">退出</a></nav>
    </footer>
  </main>

  <template id="ruleTemplate">
    <div class="rule">
      <select aria-label="逻辑关系"><option value="and">且</option><option value="or">或</option><option value="not">不含</option></select>
      <select aria-label="搜索范围"><option value="all">全部</option><option value="question">问题</option><option value="answer">回答</option><option value="title">标题</option></select>
      <input aria-label="关键词" placeholder="关键词">
      <button class="remove-rule" aria-label="删除条件">×</button>
    </div>
  </template>
  <script src="./demo.js?v=real-ui-3"></script>
</body>
</html>
